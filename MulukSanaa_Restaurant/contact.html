<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تواصل معنا - ملوك صنعاء</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="bg-dark text-white py-3 sticky-top">
        <div class="container d-flex justify-content-between align-items-center">
            <h1 class="h3 m-0 text-warning"><i class="fa-solid fa-utensils"></i> ملوك صنعاء</h1>
            <nav>
                <ul class="nav">
                    <li class="nav-item"><a class="nav-link text-white" href="index.html">الرئيسية</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="menu.html">قائمة الطعام</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="about.html">من نحن</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="register.html">حساب جديد</a></li>
                    <li class="nav-item"><a class="nav-link text-warning fw-bold" href="contact.html">تواصل معنا</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <section class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-7 bg-white p-4 shadow-sm rounded">
                <h3 class="text-center mb-4 text-warning">تواصل معنا وحجز الطاولات</h3>
                <form id="contactForm">
                    <div class="mb-3">
                        <label class="form-label">الاسم:</label>
                        <input type="text" class="form-control" required placeholder="اسمك الكريم">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">رقم الهاتف:</label>
                        <input type="tel" class="form-control" required placeholder="رقم الهاتف">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">الرسالة أو الاستفسار:</label>
                        <textarea class="form-control" rows="4" required placeholder="اكتب رسالتك هنا..."></textarea>
                    </div>
                    <!-- زر لاستدعاء النافذة الثانية Modal عبر محاكاة Ajax -->
                     <button type="button" class="btn btn-warning w-100 fw-bold" data-bs-toggle="modal" data-bs-target="#ajaxModal2">إرسال الاستفسار  </button>
                </form>
            </div>
        </div>
    </section>

     <div class="modal fade" id="ajaxModal2" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-dark text-white">
                    <h5 class="modal-title text-warning">تأكيد الرسالة </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="modalBodyContent">
                    <p>شكراَ لك! تم استلام طلب حجز الطاولة والاستفسار بنجاح، وسنتواصل معك قريباَ</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">إغلاق</button>
                </div>
            </div>
        </div>
    </div>

    <footer class="bg-dark text-white text-center py-4 mt-5">
        <p class="mb-0">جميع الحقوق محفوظة &copy; 2026 - مطاعم ملوك صنعاء</p>
    </footer>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="js/main.js"></script>
</body>
</html>

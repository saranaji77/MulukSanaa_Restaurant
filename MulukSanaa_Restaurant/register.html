<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الحساب - ملوك صنعاء</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="bg-dark text-white py-3 sticky-top">
        <div class="container d-flex justify-content-between align-items-center">
            <h1 class="h3 m-0 text-warning"><i class="fa-solid fa-utensils"></i> ملوك صنعاء</h1>
            <nav>
                <ul class="nav">
                    <li class="nav-item"><a class="nav-link text-white" href="index.html">الرئيسية</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="menu.html">قائمة الطعام</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="about.html">من نحن</a></li>
                    <li class="nav-item"><a class="nav-link text-warning fw-bold" href="register.html">حساب جديد</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="contact.html">تواصل معنا</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <section class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 bg-white p-4 shadow-sm rounded">
                <h3 class="text-center mb-4 text-warning">إنشاء حساب جديد (Validation)</h3>
                <!-- نموذج مع التحقق من صحة البيانات HTML5 Validation -->
                <form id="regForm" onsubmit="validateForm(event)">
                    <div class="mb-3">
                        <label class="form-label">الاسم الكامل:</label>
                        <input type="text" class="form-control" id="regName" required placeholder="أدخل اسمك الكريم">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">البريد الإلكتروني:</label>
                        <input type="email5" class="form-control" id="regEmail" required placeholder="name@example.com">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">كلمة المرور:</label>
                        <input type="password" class="form-control" id="regPass" required minlength="6" placeholder="أدخل 6 رموز على الأقل">
                    </div>
                    <button type="submit" class="btn btn-warning w-100 fw-bold">تسجيل الحساب</button>
                </form>
            </div>
        </div>
    </section>

    <footer class="bg-dark text-white text-center py-4 mt-5">
        <p class="mb-0">جميع الحقوق محفوظة &copy; 2026 - مطاعم ملوك صنعاء</p>
    </footer>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
